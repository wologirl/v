name: Get Token from Surge

on:
  push:
    branches:
      - main

jobs:
  get-token:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Surge
        run: npm install -g surge

      - name: Fetch My Token
        run: surge token
        env:
          SURGE_LOGIN: 'woloigrifauho@gmail.com'
          SURGE_TOKEN: 'mm241654'
